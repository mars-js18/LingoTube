            const ref = React.useRef();

                if (ref.current) {
                    lucide.createIcons({
                        icons: { [name]: lucide.icons[name] },
                        nameAttr: 'data-lucide',
                        attrs: { class: className, width: size, height: size, stroke: color }
                    });
                }
            }, [name, size, className, color]);
            return <i ref={ref} data-lucide={name}></i>;

        // --- RENDERIZADOR DE TEXTO ENRIQUECIDO (Markdown Básico) ---
        const renderRichTextHTML = (text) => {
            if (!text) return { __html: '' };
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/==([\s\S]*?)==/g, '<mark class="bg-yellow-500/80 text-darker font-bold rounded px-1.5 py-0.5 shadow-sm">$1</mark>')
                .replace(/\*([\s\S]*?)\*/g, '<strong class="font-bold text-white">$1</strong>')
                .replace(/_([\s\S]*?)_/g, '<em class="italic text-duoblue">$1</em>');
            return { __html: html };
        };

        // --- LECTOR DE CSV ROBUSTO ---
        const parseCSVText = (text) => {
            const parsedData = [];
            let inQuotes = false;
            let row = [];
            let currentField = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i+1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentField += '"';
                        i++; 
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    row.push(currentField);
                    currentField = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') continue;
                    
                    row.push(currentField);
                    if (row.length >= 4 && row[0].trim() !== '#' && row[0].trim() !== '') {
                        parsedData.push({
                            id: parseInt(row[0].trim()),
                            title: row[1] ? row[1].trim() : '',
                            videoUrl: row[2] ? row[2].trim() : '',
                            videoId: row[3] ? row[3].trim() : '',
                            description: row.length > 6 && row[6] ? row[6].trim() : null
                        });
                    }
                    row = [];
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            if (currentField !== '' || row.length > 0) {
                row.push(currentField);
                if (row.length >= 4 && row[0].trim() !== '#' && row[0].trim() !== '') {
                    parsedData.push({
                        id: parseInt(row[0].trim()),
                        title: row[1] ? row[1].trim() : '',
                        videoUrl: row[2] ? row[2].trim() : '',
                        videoId: row[3] ? row[3].trim() : '',
                        description: row.length > 6 && row[6] ? row[6].trim() : null
                    });
                }
            }
            return parsedData;

        // --- UTILIDADES DE FECHA Y FORMATO CLARO ---
        const formatBackupDate = (isoOrTs) => {
            if (!isoOrTs) return 'Fecha desconocida';
            const d = new Date(isoOrTs);
            if (isNaN(d.getTime())) return 'Fecha inválida';
            const pad = (n) => String(n).padStart(2, '0');
            const day = pad(d.getDate());
            const month = pad(d.getMonth() + 1);
            const year = d.getFullYear();
            let hours = d.getHours();
            const minutes = pad(d.getMinutes());
            const seconds = pad(d.getSeconds());
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return `${day}/${month}/${year} a las ${pad(hours)}:${minutes}:${seconds} ${ampm}`;
        };

        const getFileTimestamp = (date = new Date()) => {
            const pad = (n) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}_${pad(date.getHours())}h${pad(date.getMinutes())}m${pad(date.getSeconds())}s`;
        };

        // --- SISTEMA DE COPIA DE SEGURIDAD LOCAL (IndexedDB + File System Access) ---
        const BackupDB = {
            dbPromise: null,
            getDB() {
                if (!this.dbPromise) {
                    this.dbPromise = new Promise((resolve) => {
                        if (!window.indexedDB) {
                            resolve(null);
                            return;
                        }
                        const req = indexedDB.open('LingoTubeLocalBackups', 1);
                        req.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('snapshots')) {
                                db.createObjectStore('snapshots', { keyPath: 'id' });
                            }
                            if (!db.objectStoreNames.contains('handles')) {
                                db.createObjectStore('handles');
                            }
                        };
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = (err) => {
                            console.warn("IndexedDB no disponible:", err);
                            resolve(null);
                        };
                    });
                }
                return this.dbPromise;
            },

            async getStoredHandle() {
                try {
                    const db = await this.getDB();
                    if (!db) return null;
                    return new Promise((resolve) => {
                        const tx = db.transaction('handles', 'readonly');
                        const store = tx.objectStore('handles');
                        const req = store.get('backupDirHandle');
                        req.onsuccess = () => resolve(req.result || null);
                        req.onerror = () => resolve(null);
                    });
                } catch {
                    return null;
                }
            },

            async saveStoredHandle(handle) {
                try {
                    const db = await this.getDB();
                    if (!db) return;
                    return new Promise((resolve) => {
                        const tx = db.transaction('handles', 'readwrite');
                        const store = tx.objectStore('handles');
                        if (handle) store.put(handle, 'backupDirHandle');
                        else store.delete('backupDirHandle');
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    });
                } catch {
                    return false;
                }
            },

            async getAllSnapshots() {
                try {
                    const db = await this.getDB();
                    if (!db) {
                        const raw = localStorage.getItem('lingoTubeSnapshotsFallback');
                        return raw ? JSON.parse(raw) : [];
                    }
                    return new Promise((resolve) => {
                        const tx = db.transaction('snapshots', 'readonly');
                        const store = tx.objectStore('snapshots');
                        const req = store.getAll();
                        req.onsuccess = () => {
                            const items = req.result || [];
                            items.sort((a, b) => b.id - a.id);
                            resolve(items);
                        };
                        req.onerror = () => resolve([]);
                    });
                } catch {
                    return [];
                }
            },

            async saveSnapshot(dataObj, keepOnlyLatest = true) {
                if (!dataObj || !dataObj.completed) return null;
                
                const now = new Date();
                const totalClasses = (dataObj.completed.beginner?.length || 0) + 
                                     (dataObj.completed.intermediate?.length || 0) + 
                                     (dataObj.completed.advanced?.length || 0);
                const totalReviews = (dataObj.reviews?.beginner?.length || 0) + 
                                     (dataObj.reviews?.intermediate?.length || 0) + 
                                     (dataObj.reviews?.advanced?.length || 0);
                const totalNotes = Object.keys(dataObj.notes || {}).filter(k => dataObj.notes[k]?.trim()).length;
                const totalChunks = Object.keys(dataObj.chunks || {}).filter(k => dataObj.chunks[k]?.trim()).length;

                const snapshot = {
                    id: now.getTime(),
                    createdAt: now.toISOString(),
                    displayDate: formatBackupDate(now),
                    stats: {
                        classes: totalClasses,
                        reviews: totalReviews,
                        notes: totalNotes,
                        chunks: totalChunks
                    },
                    data: JSON.parse(JSON.stringify(dataObj))
                };

                try {
                    const db = await this.getDB();
                    if (!db) {
                        let list = [];
                        try {
                            list = JSON.parse(localStorage.getItem('lingoTubeSnapshotsFallback') || '[]');
                        } catch(e) {}
                        if (keepOnlyLatest) {
                            list = [snapshot];
                        } else {
                            list.unshift(snapshot);
                            list = list.slice(0, 10);
                        }
                        localStorage.setItem('lingoTubeSnapshotsFallback', JSON.stringify(list));
                        return snapshot;
                    }

                    return new Promise((resolve) => {
                        const tx = db.transaction('snapshots', 'readwrite');
                        const store = tx.objectStore('snapshots');
                        if (keepOnlyLatest) {
                            store.clear();
                        }
                        store.put(snapshot);
                        tx.oncomplete = () => {
                            if (!keepOnlyLatest) {
                                try {
                                    const delTx = db.transaction('snapshots', 'readwrite');
                                    const delStore = delTx.objectStore('snapshots');
                                    const req = delStore.getAll();
                                    req.onsuccess = () => {
                                        const all = req.result || [];
                                        if (all.length > 10) {
                                            all.sort((a,b) => b.id - a.id);
                                            all.slice(10).forEach(old => delStore.delete(old.id));
                                        }
                                    };
                                } catch(e) {}
                            }
                            resolve(snapshot);
                        };
                        tx.onerror = () => resolve(null);
                    });
                } catch {
                    return null;
                }
            },

            async deleteSnapshot(id) {
                try {
                    const db = await this.getDB();
                    if (!db) {
                        let list = JSON.parse(localStorage.getItem('lingoTubeSnapshotsFallback') || '[]');
                        list = list.filter(item => item.id !== id);
                        localStorage.setItem('lingoTubeSnapshotsFallback', JSON.stringify(list));
                        return true;
                    }
                    return new Promise((resolve) => {
                        const tx = db.transaction('snapshots', 'readwrite');
                        tx.objectStore('snapshots').delete(id);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    });
                } catch {
                    return false;
                }
            },

            async clearOldSnapshots() {
                try {
                    const snapshots = await this.getAllSnapshots();
                    if (snapshots.length <= 1) return true;
                    const latest = snapshots[0];
                    const db = await this.getDB();
                    if (!db) {
                        localStorage.setItem('lingoTubeSnapshotsFallback', JSON.stringify([latest]));
                        return true;
                    }
                    return new Promise((resolve) => {
                        const tx = db.transaction('snapshots', 'readwrite');
                        const store = tx.objectStore('snapshots');
                        store.clear();
                        store.put(latest);
                        tx.oncomplete = () => resolve(true);
                        tx.onerror = () => resolve(false);
                    });
                } catch {
                    return false;
                }
            }
        };

        async function syncToLocalDirectory(dirHandle, dataObj, keepOnlyLatest = true) {
            if (!dirHandle) return { success: false, reason: 'no_handle' };
            try {
                const opts = { mode: 'readwrite' };
                let perm = await dirHandle.queryPermission(opts);
                if (perm !== 'granted') {
                    perm = await dirHandle.requestPermission(opts);
                    if (perm !== 'granted') return { success: false, reason: 'permission_denied' };
                }

                const now = new Date();
                const clearDate = formatBackupDate(now);
                const fileTs = getFileTimestamp(now);

                const backupPayload = {
                    _lingoTubeBackupMeta: {
                        fechaLegible: clearDate,
                        timestampISO: now.toISOString(),
                        version: '2.0',
                        descripcion: "Copia de seguridad automática de LingoTube",
                        clasesCompletadas: (dataObj.completed?.beginner?.length || 0) + (dataObj.completed?.intermediate?.length || 0) + (dataObj.completed?.advanced?.length || 0),
                        repasosCompletados: (dataObj.reviews?.beginner?.length || 0) + (dataObj.reviews?.intermediate?.length || 0) + (dataObj.reviews?.advanced?.length || 0)
                    },
                    ...dataObj
                };
                const jsonContent = JSON.stringify(backupPayload, null, 2);

                if (keepOnlyLatest) {
                    const fileHandle = await dirHandle.getFileHandle('LingoTube_Ultimo_Respaldo.json', { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(jsonContent);
                    await writable.close();

                    try {
                        for await (const [name] of dirHandle.entries()) {
                            if (name.startsWith('LingoTube_Respaldo_') && name.endsWith('.json')) {
                                await dirHandle.removeEntry(name);
                            }
                        }
                    } catch(e) {}

                    return { success: true, fileName: 'LingoTube_Ultimo_Respaldo.json', clearDate };
                } else {
                    const datedName = `LingoTube_Respaldo_${fileTs}.json`;
                    const fileHandle = await dirHandle.getFileHandle(datedName, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(jsonContent);
                    await writable.close();

                    const latestHandle = await dirHandle.getFileHandle('LingoTube_Ultimo_Respaldo.json', { create: true });
                    const latestWritable = await latestHandle.createWritable();
                    await latestWritable.write(jsonContent);
                    await latestWritable.close();

                    return { success: true, fileName: datedName, clearDate };
                }
            } catch (err) {
                console.error("Error al sincronizar con carpeta local:", err);
                return { success: false, reason: err.message };
            }
        }

        // --- ESTADO GLOBAL (Custom Hook) ---
        function useAppStore() {
            const [data, setData] = React.useState(() => {
                const saved = localStorage.getItem('lingoTubeData');
                let parsed = saved ? JSON.parse(saved) : null;
                if (!parsed) {
                    parsed = {
                        completed: { beginner: [], intermediate: [], advanced: [] },
                        reviews: { beginner: [], intermediate: [], advanced: [] },
                        bookmarks: { beginner: [], intermediate: [], advanced: [] },
                        notes: {}, chunks: {}, routineProgress: {}
                    };
                } else {
                    if (!parsed.routineProgress) parsed.routineProgress = {};
                    if (!parsed.bookmarks) parsed.bookmarks = { beginner: [], intermediate: [], advanced: [] };
                    if (!parsed.chunks) parsed.chunks = {};
                }
                return parsed;
            });

            // Ajustes y Estado de Copias de Seguridad
            const [keepOnlyLatest, setKeepOnlyLatestState] = React.useState(() => {
                const saved = localStorage.getItem('lingoTube_keepOnlyLatest');
                return saved !== null ? JSON.parse(saved) : true;
            });
            const [snapshots, setSnapshots] = React.useState([]);
            const [localDirHandle, setLocalDirHandle] = React.useState(null);
            const [localDirName, setLocalDirName] = React.useState(() => localStorage.getItem('lingoTube_localDirName') || '');
            const [lastBackupInfo, setLastBackupInfo] = React.useState(() => {
                const saved = localStorage.getItem('lingoTube_lastBackupInfo');
                return saved ? JSON.parse(saved) : null;
            });
            const [backupStatusMessage, setBackupStatusMessage] = React.useState('');

            const setKeepOnlyLatest = async (val) => {
                setKeepOnlyLatestState(val);
                localStorage.setItem('lingoTube_keepOnlyLatest', JSON.stringify(val));
                if (val) {
                    await BackupDB.clearOldSnapshots();
                    const all = await BackupDB.getAllSnapshots();
                    setSnapshots(all);
                }
            };

            // Inicializar snapshots y handle guardado
            React.useEffect(() => {
                BackupDB.getAllSnapshots().then(list => setSnapshots(list));
                BackupDB.getStoredHandle().then(handle => {
                    if (handle) {
                        setLocalDirHandle(handle);
                        setLocalDirName(handle.name || 'Carpeta Local');
                    }
                });
            }, []);

            // Guardado automático y respaldos en segundo plano con debounce
            React.useEffect(() => {
                localStorage.setItem('lingoTubeData', JSON.stringify(data));

                const timer = setTimeout(async () => {
                    const savedSnap = await BackupDB.saveSnapshot(data, keepOnlyLatest);
                    if (savedSnap) {
                        const all = await BackupDB.getAllSnapshots();
                        setSnapshots(all);
                        const info = {
                            displayDate: savedSnap.displayDate,
                            timestamp: savedSnap.createdAt
                        };
                        setLastBackupInfo(info);
                        localStorage.setItem('lingoTube_lastBackupInfo', JSON.stringify(info));
                    }

                    if (localDirHandle) {
                        await syncToLocalDirectory(localDirHandle, data, keepOnlyLatest);
                    }
                }, 1500);

                return () => clearTimeout(timer);
            }, [data, keepOnlyLatest, localDirHandle]);

            const selectLocalFolder = async () => {
                if (!('showDirectoryPicker' in window)) {
                    alert("Tu navegador actual no permite acceso directo al explorador de archivos local. Las copias de seguridad se mantendrán automáticamente guardadas en la base de datos interna de tu navegador con fecha clara.");
                    return;
                }
                try {
                    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    if (handle) {
                        await BackupDB.saveStoredHandle(handle);
                        setLocalDirHandle(handle);
                        setLocalDirName(handle.name);
                        localStorage.setItem('lingoTube_localDirName', handle.name);
                        
                        const res = await syncToLocalDirectory(handle, data, keepOnlyLatest);
                        if (res.success) {
                            setBackupStatusMessage(`¡Carpeta vinculada! Se guardó ${res.fileName}`);
                            setTimeout(() => setBackupStatusMessage(''), 4500);
                        }
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error("Error al seleccionar carpeta:", err);
                        alert("No se pudo vincular la carpeta: " + err.message);
                    }
                }
            };

            const disconnectLocalFolder = async () => {
                await BackupDB.saveStoredHandle(null);
                setLocalDirHandle(null);
                setLocalDirName('');
                localStorage.removeItem('lingoTube_localDirName');
                setBackupStatusMessage('Carpeta local de PC desvinculada.');
                setTimeout(() => setBackupStatusMessage(''), 3500);
            };

            const createManualSnapshot = async () => {
                const snap = await BackupDB.saveSnapshot(data, keepOnlyLatest);
                let folderExtra = '';
                if (localDirHandle) {
                    const res = await syncToLocalDirectory(localDirHandle, data, keepOnlyLatest);
                    if (res.success) folderExtra = ` y en carpeta "${localDirName}"`;
                }
                const all = await BackupDB.getAllSnapshots();
                setSnapshots(all);
                const info = {
                    displayDate: snap.displayDate,
                    timestamp: snap.createdAt
                };
                setLastBackupInfo(info);
                localStorage.setItem('lingoTube_lastBackupInfo', JSON.stringify(info));
                setBackupStatusMessage(`¡Copia creada con éxito${folderExtra}! (${snap.displayDate})`);
                setTimeout(() => setBackupStatusMessage(''), 4500);
            };

            const restoreSnapshot = (snapshot) => {
                if (!snapshot || !snapshot.data) return;
                const confirmMsg = `¿Deseas restaurar la copia de seguridad del:\n\n📅 ${snapshot.displayDate}\n\nContiene: ${snapshot.stats?.classes || 0} clases completadas y ${snapshot.stats?.reviews || 0} repasos.\n\n⚠️ Tu progreso actual será reemplazado por los datos de esta copia.`;
                if (window.confirm(confirmMsg)) {
                    setData(snapshot.data);
                    localStorage.setItem('lingoTubeData', JSON.stringify(snapshot.data));
                    alert(`¡Progreso restaurado con éxito a la copia del ${snapshot.displayDate}!`);
                }
            };

            const deleteSnapshot = async (id, displayDate) => {
                if (window.confirm(`¿Eliminar la copia de seguridad del ${displayDate}?`)) {
                    await BackupDB.deleteSnapshot(id);
                    const all = await BackupDB.getAllSnapshots();
                    setSnapshots(all);
                }
            };

            const clearOldSnapshots = async () => {
                if (window.confirm("¿Deseas borrar todas las copias anteriores y conservar únicamente la más reciente?")) {
                    await BackupDB.clearOldSnapshots();
                    if (localDirHandle) {
                        try {
                            for await (const [name] of localDirHandle.entries()) {
                                if (name.startsWith('LingoTube_Respaldo_') && name.endsWith('.json')) {
                                    await localDirHandle.removeEntry(name);
                                }
                            }
                        } catch(e) {}
                    }
                    const all = await BackupDB.getAllSnapshots();
                    setSnapshots(all);
                    setBackupStatusMessage("Copias anteriores eliminadas. Se conservó la más reciente.");
                    setTimeout(() => setBackupStatusMessage(''), 4000);
                }
            };

            const [courseData, setCourseData] = React.useState(() => {
                const saved = localStorage.getItem('lingoTubeCourseData_v6');
                const defaultData = { beginner: [], intermediate: [], advanced: [], beginnerReview: [], intermediateReview: [], advancedReview: [] };
                return saved ? { ...defaultData, ...JSON.parse(saved) } : defaultData;
            });

            React.useEffect(() => { localStorage.setItem('lingoTubeCourseData_v6', JSON.stringify(courseData)); }, [courseData]);

            const updateCourseData = (levelKey, levelData) => setCourseData(prev => ({ ...prev, [levelKey]: levelData }));

            const toggleProgress = (level, classId, type) => {
                setData(prev => {
                    const isDone = prev[type][level].includes(classId);
                    const newState = { ...prev };
                    
                    if (isDone) {
                        newState[type] = { ...prev[type], [level]: prev[type][level].filter(id => id < classId) };
                        if (type === 'completed') {
                            newState.reviews = { ...prev.reviews, [level]: prev.reviews[level].filter(id => id < classId) };
                        }
                    } else {
                        const newIds = Array.from({ length: classId }, (_, i) => i + 1);
                        newState[type] = { ...prev[type], [level]: Array.from(new Set([...prev[type][level], ...newIds])) };
                        if (type === 'reviews') {
                            newState.completed = { ...prev.completed, [level]: Array.from(new Set([...prev.completed[level], ...newIds])) };
                        }
                    }
                    return newState;
                });
            };

            const toggleBookmark = (level, classId) => {
                setData(prev => {
                    const isBookmarked = prev.bookmarks[level].includes(classId);
                    return {
                        ...prev,
                        bookmarks: {
                            ...prev.bookmarks,
                            [level]: isBookmarked ? prev.bookmarks[level].filter(id => id !== classId) : [...prev.bookmarks[level], classId]
                        }
                    };
                });
            };

            const toggleRoutinePhase = (dateStr, phaseIdx, totalPhases) => {
                setData(prev => {
                    const todayProgress = prev.routineProgress?.[dateStr] || [];
                    const isDone = todayProgress.includes(phaseIdx);
                    const newProgress = isDone ? todayProgress.filter(i => i !== phaseIdx) : [...todayProgress, phaseIdx];

                    if (!isDone && newProgress.length === totalPhases) {
                        setTimeout(() => { confetti({ particleCount: 150, spread: 80, origin: { y: 0.4 }, zIndex: 9999 }); }, 100);
                    }
                    return { ...prev, routineProgress: { ...(prev.routineProgress || {}), [dateStr]: newProgress } };
                });
            };

            const saveNote = (classKey, text) => {
                setData(prev => ({ ...prev, notes: { ...prev.notes, [classKey]: text } }));
            };

            const saveChunk = (classKey, text) => {
                setData(prev => ({ ...prev, chunks: { ...(prev.chunks || {}), [classKey]: text } }));
            };

            const exportData = () => {
                const dataStr = localStorage.getItem('lingoTubeData');
                const parsed = dataStr ? JSON.parse(dataStr) : data;
                const now = new Date();
                const clearDate = formatBackupDate(now);
                const fileTs = getFileTimestamp(now);

                const fullExport = {
                    _lingoTubeBackupMeta: {
                        fechaLegible: clearDate,
                        timestampISO: now.toISOString(),
                        descripcion: "Respaldo exportado de LingoTube",
                        clasesCompletadas: (parsed.completed?.beginner?.length || 0) + (parsed.completed?.intermediate?.length || 0) + (parsed.completed?.advanced?.length || 0),
                        repasosCompletados: (parsed.reviews?.beginner?.length || 0) + (parsed.reviews?.intermediate?.length || 0) + (parsed.reviews?.advanced?.length || 0)
                    },
                    ...parsed
                };

                const blob = new Blob([JSON.stringify(fullExport, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `LingoTube_Respaldo_${fileTs}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const importData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        let cleanData = { ...importedData };
                        let metaFecha = '';
                        if (importedData._lingoTubeBackupMeta) {
                            metaFecha = importedData._lingoTubeBackupMeta.fechaLegible;
                            delete cleanData._lingoTubeBackupMeta;
                        }
                        if (cleanData && typeof cleanData === 'object' && cleanData.completed) {
                            const promptText = metaFecha 
                                ? `Este archivo tiene fecha de creación:\n📅 ${metaFecha}\n\n¿Deseas restaurar este respaldo ahora?` 
                                : "¿Deseas restaurar este respaldo ahora?";
                            if (window.confirm(promptText)) {
                                setData(cleanData);
                                localStorage.setItem('lingoTubeData', JSON.stringify(cleanData));
                                await BackupDB.saveSnapshot(cleanData, keepOnlyLatest);
                                const all = await BackupDB.getAllSnapshots();
                                setSnapshots(all);
                                alert("¡Respaldo importado y restaurado exitosamente!");
                            }
                        } else {
                            alert("El archivo no parece ser un respaldo válido de LingoTube.");
                        }
                    } catch (err) {
                        alert("Error al leer el archivo JSON: " + err.message);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const syncFromServer = async () => {
                const CSV_LEVELS = ['beginner', 'intermediate', 'advanced', 'beginnerReview', 'intermediateReview', 'advancedReview'];
                let loadedAny = false;
                for (const lvl of CSV_LEVELS) {
                    try {
                        const response = await fetch(`./${lvl}.csv`);
                        if (response.ok) {
                            const text = await response.text();
                            const parsed = parseCSVText(text);
                            if(parsed.length > 0) {
                                updateCourseData(lvl, parsed);
                                loadedAny = true;
                            }
                        }
                    } catch (err) {
                        console.log(`Error sincronizando ${lvl}:`, err);
                    }
                }
                if(loadedAny) alert("¡Datos y enlaces sincronizados con éxito desde tu GitHub Pages!");
                else alert("No se encontraron los archivos .csv. Asegúrate de que estén subidos a GitHub.");
            };

            return { 
                data, toggleProgress, toggleBookmark, toggleRoutinePhase, saveNote, saveChunk, 
                courseData, updateCourseData, exportData, importData, syncFromServer,
                keepOnlyLatest, setKeepOnlyLatest, snapshots, localDirName, selectLocalFolder, 
                disconnectLocalFolder, createManualSnapshot, restoreSnapshot, deleteSnapshot, 
                clearOldSnapshots, backupStatusMessage, lastBackupInfo
            };
        }

        const getOffset = (index) => {
            const cycle = index % 8;
            if (cycle === 0 || cycle === 4) return 0;
            if (cycle === 1 || cycle === 3) return 30;
            if (cycle === 2) return 50;
            if (cycle === 5 || cycle === 7) return -30;
            if (cycle === 6) return -50;
            return 0;
        };
        
        const BookmarkCard = ({ lvl, classId, note, chunks, displayTitle, toggleBookmark, setCurrentLevel, setSelectedClass, saveChunk, saveNote, setFullScreenEdit }) => {
            const [expanded, setExpanded] = React.useState(false);
            const classKey = `${lvl.key}-${classId}`;
            return (
                <div className="bg-surface border-2 border-orange-500/30 rounded-2xl p-4 transition-all shadow-md animate-[slideUp_0.3s_ease-out]">
                    <div className="flex justify-between items-start mb-2 cursor-pointer" onClick={() => setExpanded(!expanded)}>
                        <div className="flex-1">
                            <span className={`text-xs font-bold uppercase tracking-wider ${lvl.color} ${lvl.bg} px-2 py-1 rounded-md inline-block mb-1`}>{lvl.label} • #{classId}</span>
                            <h3 className="font-bold text-white leading-tight pr-2">{displayTitle}</h3>
                        </div>
                        <div className="flex gap-2">
                            <Icon name={expanded ? "ChevronUp" : "ChevronDown"} size={20} className="text-duotext" />
                            <div onClick={(e) => { e.stopPropagation(); toggleBookmark(lvl.key, classId); }}>
                                <Icon name="Bookmark" size={20} color="#f97316"/>
                            </div>
                        </div>
                    </div>

                    {expanded ? (
                        <div className="mt-4 animate-slide-up">
                            <div className="bg-darker p-3 rounded-2xl border border-purple-500/30 mb-3">
                                <div className="flex items-center justify-between mb-2">
                                    <label className="flex items-center gap-2 text-sm font-bold text-purple-400">
                                        <Icon name="Zap" size={16} /> Estructuras / Chunks
                                    </label>
                                    <button onClick={() => setFullScreenEdit({ classKey, type: 'chunks' })} className="flex items-center gap-1 text-[10px] bg-purple-500/20 px-2 py-1 rounded text-purple-300 hover:bg-purple-500/40 transition-colors uppercase tracking-wider font-bold">
                                        <Icon name="Maximize2" size={12} /> Expandir
                                    </button>
                                </div>
                                <textarea className="w-full bg-dark border-2 border-duogray rounded-xl p-3 text-white focus:outline-none focus:border-purple-500 resize-none h-20 font-mono text-[13px]" placeholder="Ej. ==cost an arm and a leg==" value={chunks} onChange={(e) => saveChunk(classKey, e.target.value)}></textarea>
                            </div>
                            <div className="bg-darker p-3 rounded-2xl border border-duogray/50">
                                <div className="flex items-center justify-between mb-2">
                                    <label className="flex items-center gap-2 text-sm font-bold text-duotext">
                                        <Icon name="BookOpen" size={16} /> Mis Notas
                                    </label>
                                    <button onClick={() => setFullScreenEdit({ classKey, type: 'notes' })} className="flex items-center gap-1 text-[10px] bg-white/10 px-2 py-1 rounded text-white/70 hover:bg-white/20 transition-colors uppercase tracking-wider font-bold">
                                        <Icon name="Maximize2" size={12} /> Expandir
                                    </button>
                                </div>
                                <textarea className="w-full bg-dark border-2 border-duogray rounded-xl p-3 text-white focus:outline-none focus:border-duoblue resize-none h-20 text-[14px]" placeholder="Escribe tus apuntes libres aquí..." value={note} onChange={(e) => saveNote(classKey, e.target.value)}></textarea>
                            </div>
                            <button className="mt-4 duo-btn w-full bg-duoblue text-white font-bold py-3 rounded-xl text-sm" onClick={() => { setCurrentLevel(lvl.key); setSelectedClass(classId); }}>Ir a la clase completa</button>
                        </div>
                    ) : (
                        <div className="mt-3 cursor-pointer" onClick={() => setExpanded(true)}>
                            {chunks && (
                                <div className="bg-dark p-2.5 rounded-xl border border-purple-500/20 mb-2">
                                    <div className="flex items-center gap-1 text-xs font-bold text-purple-400 mb-1"><Icon name="Zap" size={12} /> Chunks:</div>
                                    <div className="text-sm text-purple-100/90 line-clamp-2 font-mono text-[13px] whitespace-pre-wrap" dangerouslySetInnerHTML={renderRichTextHTML(chunks)} />
                                </div>
                            )}
                            {note && (
                                <div className="bg-darker p-2.5 rounded-xl border border-duogray/50">
                                    <div className="flex items-center gap-1 text-xs font-bold text-duotext mb-1"><Icon name="BookOpen" size={12} /> Apuntes:</div>
                                    <div className="text-sm text-white/80 line-clamp-2 leading-snug whitespace-pre-wrap" dangerouslySetInnerHTML={renderRichTextHTML(note)} />
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const { 
                data, toggleProgress, toggleBookmark, toggleRoutinePhase, saveNote, saveChunk, 
                courseData, updateCourseData, exportData, importData, syncFromServer,
                keepOnlyLatest, setKeepOnlyLatest, snapshots, localDirName, selectLocalFolder, 
                disconnectLocalFolder, createManualSnapshot, restoreSnapshot, deleteSnapshot, 
                clearOldSnapshots, backupStatusMessage, lastBackupInfo
            } = useAppStore();
            const [currentTab, setCurrentTab] = React.useState('learn');
            const [currentLevel, setCurrentLevel] = React.useState(() => {
                const isLevelDone = (lvl) => {
                    const done = data?.completed?.[lvl]?.length || 0;
                    const rev = data?.reviews?.[lvl]?.length || 0;
                    return done >= TOTAL_CLASSES && rev >= TOTAL_CLASSES;
                };
                if (!isLevelDone('beginner')) return 'beginner';
                if (!isLevelDone('intermediate')) return 'intermediate';
                return 'advanced';
            });
            const [selectedClass, setSelectedClass] = React.useState(null);
            const [dailyQuote, setDailyQuote] = React.useState('');
            const [showScrollTop, setShowScrollTop] = React.useState(false);
            
            // Estados para visualización a pantalla completa
            const [descExpanded, setDescExpanded] = React.useState(false);
            const [fullScreenNoteText, setFullScreenNoteText] = React.useState(null); 
            const [fullScreenEdit, setFullScreenEdit] = React.useState(null); 
            
            const activeNodeRef = React.useRef(null);

            React.useEffect(() => {
                setDailyQuote(MOTIVATIONAL_QUOTES[Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length)]);
            }, []);

            React.useEffect(() => {
                const autoLoad = async () => {
                    const CSV_LEVELS = ['beginner', 'intermediate', 'advanced', 'beginnerReview', 'intermediateReview', 'advancedReview'];
                    for (const lvl of CSV_LEVELS) {
                        if (!courseData[lvl] || courseData[lvl].length === 0) {
                            try {
                                const response = await fetch(`./${lvl}.csv`);
                                if (response.ok) {
                                    const text = await response.text();
                                    updateCourseData(lvl, parseCSVText(text));
                                }
                            } catch (e) {
                                console.log(`Esperando a GitHub Pages para cargar ${lvl}.csv`);
                            }
                        }
                    }
                };
                autoLoad();
            }, []);

            React.useEffect(() => {
                if (currentTab === 'learn' && activeNodeRef.current) {
                    setTimeout(() => { activeNodeRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
                }
            }, [currentTab, currentLevel]);

            React.useEffect(() => {
                const handleScroll = () => { setShowScrollTop(window.scrollY > 300); };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            React.useEffect(() => {
                if (selectedClass) { setDescExpanded(false); }
            }, [selectedClass]);

            const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

            const currentDay = new Date().getDay();
            const currentPlan = STUDY_PLAN[currentDay];
            const planDetails = getPlanDetails(currentPlan.type, currentLevel);

            const renderHeader = () => {
                const totalClassesDone = data.completed.beginner.length + data.completed.intermediate.length + data.completed.advanced.length;
                return (
                    <header className="fixed top-0 w-full bg-darker/70 backdrop-blur-xl z-40 border-b border-white/5 px-4 py-3 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-2 font-bold text-xl tracking-wider text-white">
                            <Icon name="PlayCircle" color="#58cc02" />
                            LingoTube
                        </div>
                        <div className="flex gap-4 font-bold text-lg">
                            <div className="flex items-center gap-1 text-duoblue">
                                <Icon name="CheckCircle" color="currentColor" />
                                <span>{totalClassesDone}</span>
                            </div>
                        </div>
                    </header>
                );
            };


            const renderLearnTab = () => {
                const classes = Array.from({ length: TOTAL_CLASSES }, (_, i) => i + 1);
                const completedInLevel = data.completed[currentLevel] || [];
                const reviewsInLevel = data.reviews[currentLevel] || [];
                
                let nextUp = classes.find(c => !completedInLevel.includes(c));
                if (!nextUp) nextUp = classes.find(c => !reviewsInLevel.includes(c)) || TOTAL_CLASSES + 1;

                return (
                    <div className="pb-24 pt-20 px-4 max-w-md mx-auto relative">

                        <div className="flex bg-surface rounded-2xl p-1 mb-8 shadow-lg">
                            {['beginner', 'intermediate', 'advanced'].map(lvl => (
                                <button key={lvl} onClick={() => setCurrentLevel(lvl)} className={`flex-1 py-2 text-sm font-bold rounded-xl transition-colors ${currentLevel === lvl ? 'bg-duogray text-white' : 'text-duotext hover:bg-duogray/50'}`}>
                                    {lvl === 'beginner' ? 'Principiante' : lvl === 'intermediate' ? 'Intermedio' : 'Avanzado'}
                                </button>
                            ))}
                        </div>

                        <div className="mb-8 flex items-center justify-between bg-surface p-4 rounded-2xl">
                            <div><h2 className="font-bold text-lg">Progreso de Nivel</h2><p className="text-sm text-duotext"><span className="text-duogreen">{completedInLevel.length} Clases</span> / <span className="text-duogold">{reviewsInLevel.length} Repasos</span></p></div>
                            <div className="text-right"><div className="text-xl font-bold text-duogreen">{Math.round((completedInLevel.length / TOTAL_CLASSES) * 100)}%</div></div>
                        </div>

                        <div className="flex flex-col items-center relative">
                            {classes.map((cls, index) => {
                                const isClassCompleted = completedInLevel.includes(cls);
                                const isReviewCompleted = reviewsInLevel.includes(cls);
                                const isCurrent = cls === nextUp;

                            const nameMap = { beginner: 'Principiante', intermediate: 'Intermedio', advanced: 'Avanzado' };
                            const classKey = lvl, reviewKey = `${lvl}Review`;
                            const classesLoaded = courseData[classKey] && courseData[classKey].length > 0;
                            const reviewsLoaded = courseData[reviewKey] && courseData[reviewKey].length > 0;
                            return (
                                <div key={lvl} className="mb-6 bg-darker p-4 rounded-xl border border-surface">
                                    <h3 className="font-bold text-md mb-3 text-white border-b border-surface pb-2">{nameMap[lvl]}</h3>
                                    <div className="mb-4">
                                        <label className="flex items-center justify-between mb-2">
                                            <span className="font-bold text-sm text-duotext">Clases Originales</span>
                                            {classesLoaded ? <span className="text-xs font-bold text-duogreen flex items-center gap-1"><Icon name="Check" size={14}/> {courseData[classKey].length} cargadas</span> : <span className="text-xs font-bold text-orange-400">Falta subir</span>}
                                        </label>
                                        <input type="file" accept=".csv" onChange={(e) => { if(e.target.files[0]) handleFileUpload(classKey, e.target.files[0]); }} className="block w-full text-xs text-duotext file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-duoblue/20 file:text-duoblue cursor-pointer" />
                                    </div>
                                    <div>
                                        <label className="flex items-center justify-between mb-2">
                                            <span className="font-bold text-sm text-duotext">Repasos de 18m</span>
                                            {reviewsLoaded ? <span className="text-xs font-bold text-duogold flex items-center gap-1"><Icon name="Check" size={14}/> {courseData[reviewKey].length} cargados</span> : <span className="text-xs font-bold text-orange-400">Falta subir</span>}
                                        </label>
                                        <input type="file" accept=".csv" onChange={(e) => { if(e.target.files[0]) handleFileUpload(reviewKey, e.target.files[0]); }} className="block w-full text-xs text-duotext file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:font-bold file:bg-duogold/20 file:text-duogold cursor-pointer" />
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const renderTabBar = () => (
                <nav className="fixed bottom-0 w-full bg-darker/80 backdrop-blur-xl border-t border-white/5 py-3 px-2 sm:px-6 z-40 pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.3)]">
                    <div className="flex justify-around max-w-md mx-auto relative">
                        <button onClick={() => setCurrentTab('learn')} className={`flex flex-col items-center p-2 rounded-xl transition-colors ${currentTab === 'learn' ? 'text-duoblue bg-duoblue/10' : 'text-duotext'}`}><Icon name="Home" /><span className="text-[10px] sm:text-xs font-bold mt-1">Aprender</span></button>
                        <button onClick={() => setCurrentTab('bookmarks')} className={`flex flex-col items-center p-2 rounded-xl transition-colors ${currentTab === 'bookmarks' ? 'text-orange-500 bg-orange-500/10' : 'text-duotext'}`}><Icon name="Bookmark" /><span className="text-[10px] sm:text-xs font-bold mt-1">Repasar</span></button>
                        <button onClick={() => setCurrentTab('stats')} className={`flex flex-col items-center p-2 rounded-xl transition-colors ${currentTab === 'stats' ? 'text-duoblue bg-duoblue/10' : 'text-duotext'}`}><Icon name="BarChart2" /><span className="text-[10px] sm:text-xs font-bold mt-1">Estadísticas</span></button>
                        <button onClick={() => setCurrentTab('profile')} className={`flex flex-col items-center p-2 rounded-xl transition-colors ${currentTab === 'profile' ? 'text-duoblue bg-duoblue/10' : 'text-duotext'}`}><Icon name="User" /><span className="text-[10px] sm:text-xs font-bold mt-1">Perfil</span></button>
                    </div>
                </nav>
            );

            const renderModal = () => {
                if (!selectedClass) return null;

                const classKey = `${currentLevel}-${selectedClass}`;
                const isClassCompleted = data.completed[currentLevel].includes(selectedClass);
                const isReviewCompleted = data.reviews[currentLevel].includes(selectedClass);
                const isBookmarked = data.bookmarks[currentLevel].includes(selectedClass);
                
                const note = data.notes[classKey] || '';
                const chunk = data.chunks[classKey] || '';

                const courseInfo = courseData[currentLevel]?.find(c => c.id === selectedClass);
                const ytClassLink = courseInfo && courseInfo.videoUrl ? courseInfo.videoUrl : `https://www.youtube.com/watch?list=${PLAYLISTS[currentLevel]}&index=${selectedClass}`;
                const displayTitle = courseInfo && courseInfo.title ? courseInfo.title : `Clase ${selectedClass}`;
                const ytReviewLink = courseData[`${currentLevel}Review`]?.find(c => c.id === selectedClass)?.videoUrl || null; 

                return (
                    <div className="fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-4 animate-fade-in backdrop-blur-sm">
                        <div className="bg-dark w-full max-w-sm rounded-3xl p-6 flex flex-col gap-4 transform transition-all border-2 border-surface animate-pop-in max-h-[90vh] overflow-y-auto shadow-2xl shadow-black/50">
                            <div className="flex justify-between items-start border-b border-surface pb-4 mb-2">
                                <div className="pr-4">
                                    <div className="text-duotext text-sm font-bold uppercase tracking-wider mb-1">{currentLevel === 'beginner' ? 'Principiante' : currentLevel === 'intermediate' ? 'Intermedio' : 'Avanzado'} • #{selectedClass}</div>
                                    <h3 className="text-xl font-bold leading-tight">{displayTitle}</h3>
                                </div>
                                <div className="flex gap-2 shrink-0">
                                    <button onClick={() => toggleBookmark(currentLevel, selectedClass)} className={`p-2 rounded-full transition-colors ${isBookmarked ? 'bg-orange-500 text-white shadow-[0_0_10px_rgba(255,165,0,0.5)]' : 'bg-surface text-duotext hover:text-white'}`} title="Marcar para repasar"><Icon name="Bookmark" /></button>
                                    <button onClick={() => { setSelectedClass(null); setDescExpanded(false); }} className="bg-surface p-2 rounded-full text-duotext hover:text-white"><Icon name="X" /></button>
                                </div>
                            </div>

                            {/* RECUADRO DE APUNTES CON EXPANSION A MODAL COMPLETO */}
                            {courseInfo && courseInfo.description && (
                                <div className="bg-darker p-4 rounded-xl border border-duoblue/30 mb-1 cursor-pointer hover:border-duoblue transition-colors shadow-sm group" onClick={() => setFullScreenNoteText(courseInfo.description)}>
                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="text-xs font-bold text-duoblue uppercase tracking-wider flex items-center gap-1">
                                            <Icon name="BookOpen" size={14} /> Notas de la Clase
                                        </h4>
                                        <Icon name="Maximize2" size={16} className="text-duoblue group-hover:scale-110 transition-transform" />
                                    </div>
                                    <div className="text-sm text-white/80 whitespace-pre-wrap leading-relaxed line-clamp-3" dangerouslySetInnerHTML={renderRichTextHTML(courseInfo.description)} />
                                    <div className="mt-3 text-center text-[10px] font-bold text-duoblue/80 uppercase tracking-widest border-t border-duogray/50 pt-2">Toca para leer todo</div>
                                </div>
                            )}

                            <div className="flex gap-2 mb-2 mt-1">
                                <a href={ytClassLink} target="_blank" className="duo-btn flex-1 bg-[#ff0000] hover:bg-[#cc0000] text-white font-bold py-3 rounded-2xl flex flex-col items-center justify-center gap-1 border-[#b30000] text-sm"><Icon name="Youtube" size={20} /><span>Clase (60m)</span></a>
                                
                                {/* BOTON DE REPASO RESTAURADO Y SIEMPRE VISIBLE */}
                                <button 
                                    onClick={() => {
                                        if (ytReviewLink) {
                                            window.open(ytReviewLink, '_blank');
                                        } else {
                                            alert(`No se encontró el enlace de repaso.\n\nPor favor, ve a la pestaña "Perfil" y presiona el botón "Sync" para descargar el archivo ${currentLevel}Review.csv desde GitHub.`);
                                        }
                                    }}
                                    className="duo-btn flex-1 bg-duogold hover:bg-duogoldDark text-white font-bold py-3 rounded-2xl flex flex-col items-center justify-center gap-1 border-[#cca000] text-sm"
                                >
                                    <Icon name="PlayCircle" size={20} /><span>Repaso (18m)</span>
                                </button>
                            </div>

                            <div className="grid grid-cols-1 gap-3 mb-2">
                                <button onClick={() => { const d = !data.completed[currentLevel].includes(selectedClass); if(d) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#58cc02', '#ffffff'] }); toggleProgress(currentLevel, selectedClass, 'completed'); }} className={`duo-btn w-full font-bold py-3 px-2 rounded-2xl flex items-center justify-center gap-2 text-[15px] border-b-4 ${isClassCompleted ? 'bg-surface text-white border-duogray' : 'bg-duogreen text-white border-duogreenDark'}`}>
                                    {isClassCompleted ? <Icon name="Undo2" size={20}/> : <Icon name="Check" size={20}/>} {isClassCompleted ? 'Desmarcar Clase' : 'Completar Clase (y previas)'}
                                </button>
                                <button onClick={() => { const d = !data.reviews[currentLevel].includes(selectedClass); if(d) confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#ffc800', '#ffffff'] }); toggleProgress(currentLevel, selectedClass, 'reviews'); }} className={`duo-btn w-full font-bold py-3 px-2 rounded-2xl flex items-center justify-center gap-2 text-[15px] border-b-4 ${isReviewCompleted ? 'bg-surface text-white border-duogray' : 'bg-duogold text-white border-duogoldDark'}`}>
                                    {isReviewCompleted ? <Icon name="Undo2" size={20}/> : <Icon name="RotateCw" size={20}/>} {isReviewCompleted ? 'Desmarcar Repaso' : 'Completar Repaso (y previos)'}
                                </button>
                            </div>

                            {/* RECUADRO DE CHUNKS CON BOTON DE EXPANSION */}
                            <div className="mt-2 bg-darker p-3 rounded-2xl border border-purple-500/30">
                                <div className="flex items-center justify-between mb-2">
                                    <label className="flex items-center gap-2 text-sm font-bold text-purple-400">
                                        <Icon name="Zap" size={16} /> Estructuras / Chunks
                                    </label>
                                    <button onClick={() => setFullScreenEdit({ classKey, type: 'chunks' })} className="flex items-center gap-1 text-[10px] bg-purple-500/20 px-2 py-1 rounded text-purple-300 hover:bg-purple-500/40 transition-colors uppercase tracking-wider font-bold">
                                        <Icon name="Maximize2" size={12} /> Expandir
                                    </button>
                                </div>
                                <textarea className="w-full bg-dark border-2 border-duogray rounded-xl p-3 text-white focus:outline-none focus:border-purple-500 resize-none h-16 font-mono text-[13px]" placeholder="Ej. ==cost an arm and a leg==" value={chunk} onChange={(e) => saveChunk(classKey, e.target.value)}></textarea>
                            </div>

                            {/* RECUADRO DE NOTAS CON BOTON DE EXPANSION */}
                            <div className="mt-2 bg-darker p-3 rounded-2xl border border-duogray/50">
                                <div className="flex items-center justify-between mb-2">
                                    <label className="flex items-center gap-2 text-sm font-bold text-duotext">
                                        <Icon name="BookOpen" size={16} /> Mis Notas
                                    </label>
                                    <button onClick={() => setFullScreenEdit({ classKey, type: 'notes' })} className="flex items-center gap-1 text-[10px] bg-white/10 px-2 py-1 rounded text-white/70 hover:bg-white/20 transition-colors uppercase tracking-wider font-bold">
                                        <Icon name="Maximize2" size={12} /> Expandir
                                    </button>
                                </div>
                                <textarea className="w-full bg-surface border-2 border-duogray rounded-xl p-3 text-white focus:outline-none focus:border-duoblue resize-none h-16 text-[14px]" placeholder="Escribe tus apuntes libres aquí..." value={note} onChange={(e) => saveNote(classKey, e.target.value)}></textarea>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderFullScreenNote = () => {
                if (!fullScreenNoteText) return null;
                return (
                    <div className="fixed inset-0 bg-darker z-[70] flex flex-col animate-slide-up">
                        <div className="flex justify-between items-center p-4 border-b border-surface bg-dark shadow-md shrink-0 pt-safe">
                            <h3 className="font-bold text-lg text-white flex items-center gap-2">
                                <Icon name="BookOpen" className="text-duoblue" /> Apuntes de la Clase
                            </h3>
                            <button onClick={() => setFullScreenNoteText(null)} className="bg-surface p-2 rounded-full text-duotext hover:text-white">
                                <Icon name="X" />
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1 text-white/90 leading-relaxed whitespace-pre-wrap text-[15px] pb-safe" dangerouslySetInnerHTML={renderRichTextHTML(fullScreenNoteText)} />
                    </div>
                );
            };

            // MODAL DEL EDITOR DE PANTALLA COMPLETA
            const renderFullScreenEditor = () => {
                if (!fullScreenEdit) return null;
                
                const { classKey, type } = fullScreenEdit;
                const text = type === 'chunks' ? (data.chunks[classKey] || '') : (data.notes[classKey] || '');
                
                const handleChange = (e) => {
                    if (type === 'chunks') saveChunk(classKey, e.target.value);
                    else saveNote(classKey, e.target.value);
                };

                const title = type === 'chunks' ? "Estructuras / Chunks" : "Mis Notas";
                const iconName = type === 'chunks' ? "Zap" : "BookOpen";
                const colorClass = type === 'chunks' ? "text-purple-400" : "text-duoblue";
                const placeholder = type === 'chunks' ? "Ej. ==cost an arm and a leg==" : "Escribe tus apuntes aquí...";
                const bgFocusClass = type === 'chunks' ? "focus:border-purple-500" : "focus:border-duoblue";

                return (
                    <div className="fixed inset-0 bg-darker z-[80] flex flex-col animate-slide-up">
                        <div className="flex justify-between items-center p-4 border-b border-surface bg-dark shadow-md shrink-0 pt-safe">
                            <h3 className={`font-bold text-lg flex items-center gap-2 ${colorClass}`}>
                                <Icon name={iconName} /> {title}
                            </h3>
                            <button onClick={() => setFullScreenEdit(null)} className="bg-duogreen hover:bg-duogreenDark text-white px-4 py-2 rounded-xl font-bold flex items-center gap-1 transition-colors">
                                <Icon name="Check" size={18} /> Listo
                            </button>
                        </div>
                        <div className="p-4 flex-1 flex flex-col pb-safe">
                            <div className="bg-surface p-3 rounded-xl mb-3 flex items-center gap-2 text-sm text-duotext shadow-inner">
                                <Icon name="Info" size={16} className={colorClass} /> 
                                <span>Usa <strong className="text-white">==texto==</strong> para subrayar lo más importante.</span>
                            </div>
                            <textarea 
                                className={`w-full flex-1 bg-dark border-2 border-duogray rounded-2xl p-4 text-white focus:outline-none ${bgFocusClass} resize-none text-[16px] leading-relaxed shadow-inner ${type === 'chunks' ? 'font-mono' : ''}`}
                                value={text}
                                onChange={handleChange}
                                placeholder={placeholder}
                                autoFocus
                            ></textarea>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen relative font-sans overflow-x-hidden">
                    {renderHeader()}
                    <main className="animate-fade-in" key={currentTab}>
                        {currentTab === 'learn' && renderLearnTab()}
                        {currentTab === 'bookmarks' && renderBookmarksTab()}
                        {currentTab === 'stats' && renderStatsTab()}
                        {currentTab === 'profile' && renderProfileTab()}
                    </main>
                    
                    {showScrollTop && currentTab === 'learn' && (
                        <button onClick={scrollToTop} className="fixed bottom-20 right-4 w-12 h-12 bg-duoblue hover:bg-duoblueDark text-white rounded-full shadow-lg flex items-center justify-center z-30 transition-all animate-scale-in" aria-label="Subir"><Icon name="ArrowUp" size={24} /></button>
                    )}

                    {renderTabBar()}
                    {renderModal()}
                    {renderFullScreenNote()}
                    {renderFullScreenEditor()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
